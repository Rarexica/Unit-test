name: Run unit tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Unittest
        run: |
          ls -la
          find . -name "test_*.py" -not -path "./.git/*"
          find . -name "*.py" -not -path "./.git/*" | head -20

      - name: Run unit tests
        run: python -m unittest discover -s "Cod + test" -p "test_*.py" -v